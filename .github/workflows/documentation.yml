name: API Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Pull requests validate the documentation build.
# Pushes to main also publish the generated output to api-docs,
# so this POC needs write access to repository contents.
permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The project Unity version controls both the managed DLL cache and
      # the external Unity API reference map used later in the build.
      - name: Read Unity version
        id: unity-version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^m_EditorVersion:[[:space:]]*//p' ProjectSettings/ProjectVersion.txt | head -1)

          if [ -z "$VERSION" ]; then
            echo "Could not read Unity version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Unity version: $VERSION"

      # DocFX needs the Unity assemblies to resolve UnityEngine types during
      # metadata compilation, but the Unity editor itself does not need to run.
      # The cache avoids extracting the same DLLs again on every build.
      - name: Cache Unity managed DLLs
        id: cache-unity-dlls
        uses: actions/cache@v4
        with:
          path: lib/UnityEngine
          key: unity-managed-dlls-${{ steps.unity-version.outputs.version }}-v1

      # On a cache miss, find a matching GameCI editor image that can provide
      # the managed Unity DLLs required by DocFX.
      - name: Find matching GameCI image
        if: steps.cache-unity-dlls.outputs.cache-hit != 'true'
        id: unity-image
        shell: bash
        run: |
          VERSION="${{ steps.unity-version.outputs.version }}"

          TAG=$(curl -fsSL "https://hub.docker.com/v2/repositories/unityci/editor/tags?page_size=100&name=ubuntu-$VERSION" \
            | jq -r '.results[].name' \
            | grep -i 'base' \
            | sort \
            | tail -1)

          if [ -z "$TAG" ]; then
            echo "No GameCI editor tag found for Unity $VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using unityci/editor:$TAG"

      # Copy only the managed UnityEngine assemblies out of the matching
      # editor image. The full Unity editor is not run as part of this job.
      - name: Extract Unity managed DLLs
        if: steps.cache-unity-dlls.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p lib

          docker create \
            --name unity-editor \
            "unityci/editor:${{ steps.unity-image.outputs.tag }}"

          docker cp \
            unity-editor:/opt/unity/Editor/Data/Managed/UnityEngine \
            lib/

          docker rm unity-editor

      # Restore the DocFX version pinned by the repository tool manifest.
      - name: Restore local tools
        run: dotnet tool restore

      # Download the reference map for this Unity release stream so inherited
      # Unity API members can link to the matching scripting reference pages.
      - name: Download Unity API xref map
        shell: bash
        run: |
          UNITY_VERSION="${{ steps.unity-version.outputs.version }}"
          UNITY_STREAM="$(echo "$UNITY_VERSION" | grep -oE '^[0-9]+\.[0-9]+')"

          if [ -z "$UNITY_STREAM" ]; then
            echo "Could not determine Unity release stream from: $UNITY_VERSION" >&2
            exit 1
          fi

          echo "Unity release stream: $UNITY_STREAM"

          mkdir -p docs-generated

          curl -fL \
            "https://normanderwan.github.io/UnityXrefMaps/${UNITY_STREAM}/xrefmap.yml" \
            -o docs-generated/unity-xrefmap.yml

      # Generate the raw DocFX Markdown before applying the compatibility
      # changes needed by the receiving Docusaurus site.
      - name: Generate raw DocFX Markdown
        run: dotnet docfx metadata Documentation/docfx.json

      # Convert the raw DocFX output into the Markdown consumed by the
      # Docusaurus POC, including the external Unity API reference handling.
      - name: Prepare Docusaurus API Markdown
        shell: pwsh
        run: |
          ./Documentation/tools/postprocess-docfx.ps1 `
            -InputDir "./docs-generated/docfx-raw" `
            -OutputDir "./docs-generated/api" `
            -UnityXrefMapPath "./docs-generated/unity-xrefmap.yml" `
            -StripKindPrefix

      # Keep both stages as workflow artifacts so generation and
      # post-processing problems can be inspected separately.
      - name: Upload raw DocFX Markdown
        uses: actions/upload-artifact@v4
        with:
          name: api-markdown-raw
          path: docs-generated/docfx-raw

      - name: Upload Docusaurus-ready API Markdown
        uses: actions/upload-artifact@v4
        with:
          name: api-markdown
          path: docs-generated/api

      # Pull requests stop after validation. Accepted pushes to main also
      # replace the machine-generated api-docs branch with the latest output.
      - name: Publish generated Markdown to api-docs branch
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_DIR="$RUNNER_TEMP/api-docs-publish"

          mkdir -p "$PUBLISH_DIR/api"

          # Generated Docusaurus-ready API documentation.
          cp -r docs-generated/api/. "$PUBLISH_DIR/api/"

          # Human-readable explanation of this generated branch.
          cp Documentation/api-docs-README.md "$PUBLISH_DIR/README.md"

          # Optional documentation pipeline guide.
          if [ -f "Documentation/guides/documentation-pipeline.pdf" ]; then
            cp \
              Documentation/guides/documentation-pipeline.pdf \
              "$PUBLISH_DIR/documentation-pipeline.pdf"
          fi

          cd "$PUBLISH_DIR"

          git init
          git checkout -b api-docs

          git config user.name "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"

          git add --all
          git commit -m "docs: regenerate API @ ${{ github.sha }}"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin HEAD:api-docs
